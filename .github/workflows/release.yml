name: Android APK Release

# Versioning scheme: semver MAJOR.MINOR.PATCH, tags always v<semver>
# (optionally with a -SNAPSHOT suffix for pre-releases, see the
# "Determine release type" step below).
#
# The git tag is the source of truth for a released build's version — this
# workflow injects it into the APK via --build-name/--build-number, so it
# always overrides whatever `version:` currently sits in pubspec.yaml.
# pubspec.yaml's version is kept roughly in step (bumped by hand ahead of
# each release) purely so local/dev builds report a sensible number; it is
# never read here.
on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Determine release type
        id: release_type
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" =~ -[Ss][Nn][Aa][Pp][Ss][Hh][Oo][Tt]$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # `secrets` is not one of the contexts available to a step's `if:` —
      # referencing it there is a workflow validation error that stops the
      # whole file starting, which is what kept this workflow from ever
      # running. The steps below branch on this boolean instead, so the
      # signing key stays in the environment of the one step that decodes it
      # rather than every step in the job.
      - name: Detect signing configuration
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Require signing secrets for non-snapshot releases
        if: ${{ steps.release_type.outputs.prerelease == 'false' && steps.signing.outputs.present == 'false' }}
        run: |
          echo "::error::KEYSTORE_BASE64 secret is not set — refusing to publish an unsigned release."
          exit 1

      - name: Decode keystore
        if: ${{ steps.signing.outputs.present == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks

      - name: Create key.properties
        if: ${{ steps.signing.outputs.present == 'true' }}
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          # storeFile is resolved relative to android/app/ by build.gradle.
          KEYSTORE_FILENAME="keystore.jks"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" "$KEYSTORE_FILENAME" \
            > android/key.properties

      - name: Build release APK
        env:
          TAG: ${{ steps.release_type.outputs.tag }}
        run: |
          BUILD_NAME="${TAG#v}"
          flutter build apk --release --flavor prod \
            --build-name="$BUILD_NAME" \
            --build-number="$GITHUB_RUN_NUMBER"

      - name: Rename APK
        env:
          TAG: ${{ steps.release_type.outputs.tag }}
        run: |
          mv build/app/outputs/flutter-apk/app-prod-release.apk \
             "build/app/outputs/flutter-apk/RepFoundry-${TAG}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_type.outputs.tag }}
          name: "RepFoundry ${{ steps.release_type.outputs.tag }}"
          prerelease: ${{ steps.release_type.outputs.prerelease }}
          generate_release_notes: true
          files: "build/app/outputs/flutter-apk/RepFoundry-${{ steps.release_type.outputs.tag }}.apk"
