name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Analyse & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyse
        run: dart analyze

      - name: Run tests
        run: flutter test
