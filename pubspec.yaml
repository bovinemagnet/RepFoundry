name: rep_foundry
description: RepFoundry - A simple, fast workout tracking app for gym-goers.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.2.1
  go_router: ^17.1.0
  fl_chart: ^1.1.1
  uuid: ^4.4.0
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  drift: ^2.32.0
  drift_flutter: ^0.3.0
  path_provider: ^2.1.5
  path: ^1.9.1
  audioplayers: ^6.1.0
  geolocator: ^14.0.2
  flutter_blue_plus: ^2.2.1
  share_plus: ^12.0.1
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.0
  health: ^13.3.1
  google_sign_in: ^7.2.0
  googleapis: ^16.0.0
  googleapis_auth: ^2.0.0
  connectivity_plus: ^7.0.0
  http: ^1.2.2
  url_launcher: ^6.2.5
  package_info_plus: ^9.0.1
  google_fonts: ^8.1.0
  app_settings: ^7.0.0
  hr_zones: ^0.0.2
  flutter_timezone: ^5.1.0
  clock: ^1.1.1
  flutter_foreground_task: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  drift_dev: ^2.32.0
  build_runner: ^2.4.14
  fake_async: ^1.3.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/sounds/
    - assets/images/icons/RepFoundary_icon.png
    - assets/images/exercises/
  # Bundled offline so google_fonts resolves these from assets (runtime
  # fetching is disabled in main.dart). Family names must match the names
  # google_fonts uses: GoogleFonts.jetBrainsMono / .manrope / .spaceGrotesk.
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Thin.ttf
          weight: 100
        - asset: assets/fonts/JetBrainsMono-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/JetBrainsMono-Light.ttf
          weight: 300
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-ExtraBold.ttf
          weight: 800
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Manrope-Light.ttf
          weight: 300
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Light.ttf
          weight: 300
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
