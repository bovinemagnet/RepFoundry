site:
  title: RepFoundry Documentation
  # Project-site URL on GitHub Pages. The /RepFoundry path segment matters —
  # Antora uses it as the site's base path when generating the 404 page and
  # sitemap, which would otherwise point at the domain root.
  url: https://bovinemagnet.github.io/RepFoundry
  start_page: repfoundry::index.adoc

content:
  sources:
    - url: .
      branches: HEAD
      start_path: src/docs

ui:
  bundle:
    # Built from source in ui/ by `gulp bundle`. Antora needs the packed zip,
    # not the source tree, and ui/.gitignore excludes build/ — so this file is
    # produced by the build, never committed. The Gradle `antora` task depends
    # on `uiBundle`, and the docs workflow packs it before generating the site.
    url: ./ui/build/ui-bundle.zip
    snapshot: true

output:
  dir: build/site
